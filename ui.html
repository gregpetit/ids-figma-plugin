<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px;
      margin: 0;
      background: #ffffff;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 14px;
      font-weight: 600;
      color: #000;
    }
    .section {
      margin-bottom: 24px;
    }
    .component-box {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 16px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      background: #f9f9f9;
    }
    .component-box.set {
      border-color: #18a0fb;
      background: #e5f4ff;
    }
    .component-name {
      font-weight: 500;
      color: #000;
      text-align: center;
    }
    .placeholder {
      color: #999;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .primary {
      background: #18a0fb;
      color: white;
    }
    .primary:hover {
      background: #0d8ce8;
    }
    .primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .secondary {
      background: #e5e5e5;
      color: #333;
      margin-bottom: 8px;
    }
    .secondary:hover {
      background: #d9d9d9;
    }
    .status {
      margin-top: 0;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.show {
      display: block;
    }
    .status.error {
      background: #ffe5e5;
      color: #c00;
    }
    .status.success {
      background: #e5ffe5;
      color: #080;
    }
    .status.info {
      background: #e5f4ff;
      color: #0066cc;
    }
    .info {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 6px;
      font-size: 11px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .ready-state {
      background: #e5ffe5;
      border: 2px solid #18a0fb;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #000;
    }
    .ready-state h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
      font-weight: 600;
      color: #18a0fb;
    }
    .ready-state p {
      margin: 4px 0;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <h2>Component Swapper</h2>
  
  <div class="status" id="status"></div>
  
  <div class="info" id="info-message">
    Select an instance or component to swap. The plugin will auto-detect the target component.
  </div>

  <div id="ready-state" class="ready-state" style="display: none;">
    <h3>✓ Ready to Swap</h3>
    <p><strong>Old Component:</strong> <span id="old-component-name">-</span></p>
    <p><strong>New Component:</strong> <span id="new-component-name">-</span></p>
    <p style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #ccc;">
      <strong style="font-size: 14px;">Instances Found: <span id="instance-count">0</span></strong>
    </p>
    <button class="primary" id="swap-all-btn" onclick="swapAllInstances()" style="margin-top: 12px;" disabled>
      Swap All Instances
    </button>
    <button class="secondary" onclick="rescanInstances()" style="margin-top: 8px;">
      🔄 Refresh Count
    </button>
  </div>

  <div class="section" id="setup-section">
    <h2>Select Component</h2>
    <p style="font-size: 11px; color: #666; margin-bottom: 12px;">
      Select an instance or component master to swap:
    </p>
    
    <div class="component-box" id="old-box">
      <div class="placeholder">No component selected</div>
    </div>
    <button class="secondary" onclick="setOldComponent()">Set Component</button>
  </div>

  <script>
    var componentsReady = false;

    function setOldComponent() {
      parent.postMessage({ pluginMessage: { type: 'set-old-component' } }, '*');
    }

    function showStatus(message, type) {
      var status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status show ' + type;
      
      // Auto-hide success messages after 3 seconds
      if (type === 'success' || type === 'info') {
        setTimeout(function() {
          status.className = 'status';
        }, 3000);
      }
    }

    function showReadyState(oldName, newName) {
      document.getElementById('old-component-name').textContent = oldName;
      document.getElementById('new-component-name').textContent = newName;
      document.getElementById('ready-state').style.display = 'block';
      document.getElementById('setup-section').style.display = 'none';
      document.getElementById('info-message').innerHTML = 
        '<strong>Ready!</strong> Found instances of "' + oldName + '". Click "Swap All Instances" to replace them with "' + newName + '". ' +
        'The plugin will preserve appearance properties and instance state automatically.';
      componentsReady = true;
    }

    function swapAllInstances() {
      var btn = document.getElementById('swap-all-btn');
      btn.disabled = true;
      btn.textContent = 'Swapping...';
      parent.postMessage({ pluginMessage: { type: 'swap-all' } }, '*');
    }

    function rescanInstances() {
      parent.postMessage({ pluginMessage: { type: 'scan-instances' } }, '*');
      showStatus('Scanning for instances...', 'info');
    }

    function updateInstanceCount(count) {
      var countEl = document.getElementById('instance-count');
      if (countEl) {
        countEl.textContent = count;
      }
      var btn = document.getElementById('swap-all-btn');
      if (btn) {
        btn.disabled = (count === 0);
        if (count === 0) {
          btn.textContent = 'No Instances Found';
        } else {
          btn.textContent = 'Swap All Instances (' + count + ')';
        }
      }
    }

    window.onmessage = function(event) {
      var msg = event.data.pluginMessage;

      if (msg.type === 'components-ready') {
        showReadyState(msg.oldName, msg.newName);
        showStatus('Ready to swap!', 'success');
      }

      if (msg.type === 'old-component-set') {
        document.getElementById('old-box').innerHTML = 
          '<div class="component-name">' + msg.name + '</div>';
        document.getElementById('old-box').classList.add('set');
        showStatus('Component set: ' + msg.name, 'success');
        // Request ready state check
        parent.postMessage({ pluginMessage: { type: 'check-ready' } }, '*');
      }

      if (msg.type === 'new-component-auto-detected') {
        // New component was auto-detected, trigger ready state
        parent.postMessage({ pluginMessage: { type: 'check-ready' } }, '*');
      }

      if (msg.type === 'instances-found') {
        updateInstanceCount(msg.count);
        if (msg.count > 0) {
          showStatus('Found ' + msg.count + ' instances of "' + msg.oldName + '"', 'info');
        } else {
          showStatus('No instances found', 'info');
        }
      }

      if (msg.type === 'swap-complete') {
        var btn = document.getElementById('swap-all-btn');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Swap All Instances';
        }
        showStatus(
          'Swapped ' + msg.swapped + ' of ' + msg.total + ' instances (preserved ' + 
          msg.preserved + ' properties)', 
          'success'
        );
        // Rescan instances after swap
        setTimeout(function() {
          parent.postMessage({ pluginMessage: { type: 'scan-instances' } }, '*');
        }, 500);
      }

      if (msg.type === 'error') {
        var btn = document.getElementById('swap-all-btn');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Swap All Instances';
        }
        showStatus(msg.message, 'error');
      }
    };
  </script>
</body>
</html>
